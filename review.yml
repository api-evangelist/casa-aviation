aid: casa-aviation
name: Civil Aviation Safety Authority (CASA)
review:
  question: >-
    Does CASA publish a real, reachable public API or data surface, and what
    would it cost a customer of CASA to leave it?
  answer: true
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: regulator
  homeMarket: Australia
  primaryDomain: casa.gov.au
findings:
  summary: |
    CASA publishes two genuinely open, no-key bulk data products and one
    approval-gated partner API. There is NO developer portal, NO OpenAPI,
    NO Swagger, NO Postman collection and no /developers, /api or
    /.well-known surface on casa.gov.au.

    A search-engine result titled "API | Civil Aviation Safety Authority" at
    https://www.casa.gov.au/search-centre/aircraft-register/api is NOT API
    documentation. It was fetched and read: it is the aircraft register
    detail record for the aircraft carrying the registration mark VH-API
    (an amateur-built Van's RV-6, serial V285). This false positive is
    recorded here so it is not mistaken for a developer surface again.

    The open surfaces are flat files served from services.casa.gov.au:
    a full Airworthiness Directives listing as JSON and CSV, and the
    complete Australian Civil Aircraft Register as a daily CSV/ZIP.
    The gated surface is the CASA RPAS Digital Platform at
    data.casa.rpasplatform.net, whose endpoints are named in public PDFs
    but require a service account and a signed agreement.
  developerPortal:
    exists: false
    note: >-
      No developer/developers/docs/api subdomain and no /developers or /api
      path was found. The nearest developer-facing page is the drone
      Digital platform page, which describes an application-and-approval
      onboarding process, not a self-serve portal.
    nearestEquivalent: https://www.casa.gov.au/drones/industry-initiatives/digital-platform
  outOfScope: >-
    CASA is a safety regulator. It does not regulate airline distribution,
    fares, full-content agreements, GDS surcharging or consumer disclosure,
    and it holds no GDS, NDC, channel-manager, OTA or metasearch position.
    Nothing in the travel distribution chain runs through CASA.
probes:
  note: >-
    casa.gov.au and services.casa.gov.au reject direct programmatic requests
    from this probe host. www.casa.gov.au hung on HTTP/2 (stream INTERNAL_ERROR)
    and timed out on HTTP/1.1, returning curl code 000; services.casa.gov.au
    and data.casa.rpasplatform.net returned 403 to curl. All page and file
    contents recorded below were retrieved instead through a rendering text
    proxy that reported upstream HTTP 200. Both the direct status and the
    proxied status are recorded, and nothing was inferred from a failed probe.
  results:
    - url: https://www.casa.gov.au/
      directStatus: 000
      note: TLS handshake succeeded (cert CN=govcms.gov.au); HTTP/2 stream closed with INTERNAL_ERROR, HTTP/1.1 timed out.
    - url: https://www.casa.gov.au/search-centre/aircraft-register/api
      directStatus: 000
      proxiedStatus: 200
      note: NOT an API page. Aircraft register record for registration mark VH-API (AMATEUR BUILT AIRCRAFT, VAN'S RV-6, serial V285, ICAO type designator RV6).
    - url: https://www.casa.gov.au/aircraft/aircraft-registration/data-files-registered-aircraft
      directStatus: 000
      proxiedStatus: 200
      note: Documents acrftreg.csv and acrftreg.zip; cites CASR 47.030 as the publication obligation.
    - url: https://www.casa.gov.au/aircraft/airworthiness/airworthiness-directives/data-files-all-airworthiness-directives
      directStatus: 000
      proxiedStatus: 200
      note: Documents combinedadweb.json, adweb.csv, folder.csv and the /airworth/airwd/ADfiles/ PDF addressing scheme.
    - url: https://www.casa.gov.au/drones/industry-initiatives/digital-platform
      directStatus: 000
      proxiedStatus: 200
      note: RPAS Digital Platform onboarding page; links ConOps, Operating Rules, Test Procedure, Declaration of Compliance and Terms and Conditions.
    - url: https://services.casa.gov.au/JSON/combinedadweb.json
      directStatus: 403
      proxiedStatus: 200
      fetchDate: '2026-07-28'
      note: >-
        Confirmed live and parseable. First records observed:
        {"DATA":[{"ADName":"Electrical Switch - CANCELLED","ADNUMBER":"1",
        "ADIssueNumber":"NK","ADFILE":"GEN-001.pdf","FOLDERNAME":"GEN",
        "GROUPTITLE":"AIRGEN","Authority":"CASA","ID":7773,"Status":"Cancelled",
        "SeriesName":"Aircraft - General","SeriesNumber":"AD/GENERAL/"}...]}
        Upstream Last-Published header reported 2026-07-27.
    - url: https://services.casa.gov.au/airworth/airwd/data/adweb.csv
      directStatus: 403
      note: Documented by CASA as the listing of all current ADs. Not retrieved from this host.
    - url: https://services.casa.gov.au/airworth/airwd/data/folder.csv
      directStatus: 403
      note: Documented by CASA as the listing of aircraft/equipment types. Not retrieved from this host.
    - url: https://services.casa.gov.au/CSV/acrftreg.csv
      directStatus: 403
      note: Documented by CASA as ~7.6MB comma-delimited full civil aircraft register, updated daily.
    - url: https://services.casa.gov.au/CSV/acrftreg.zip
