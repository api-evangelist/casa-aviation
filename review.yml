    - url: https://data.casa.rpasplatform.net/
      directStatus: 403
    - url: https://data.casa.rpasplatform.net/casa/data/advisories.geojson
      directStatus: 403
      note: Named in RPAS Platform Operating Rules Attachment A as the CASA Advisories feed, refresh at least every 15 minutes.
    - url: https://data.casa.rpasplatform.net/casa/data/notifications.json
      directStatus: 403
      note: Named in Operating Rules Attachment A as CASA Notifications; "URL needs authentication with a service account."
    - url: https://data.casa.rpasplatform.net/casa/gcd
      directStatus: 403
      note: Named in Operating Rules Attachment A; other GCD files, refresh at least every 24 hours.
    - url: https://data.casa.rpasplatform.net/asa/gcd
      directStatus: 403
      note: Named in Operating Rules Attachment A; facility maps, refresh at least every 24 hours.
