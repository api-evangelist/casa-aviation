summary: >-
  CASA publishes no /.well-known/ discovery surface. Every RFC 9116 security.txt,
  OIDC discovery, RFC 8414 authorization-server metadata, RFC 9727 api-catalog and
  ai-plugin.json probe missed across all four CASA hosts. No raw documents were
  saved because none returned 200. This absence is recorded deliberately - it is a
  real finding, not a gap in the probe.
result: none-found
probe_note: >-
  www.casa.gov.au does not answer programmatic clients from this probe host at all
  (HTTP/2 stream INTERNAL_ERROR, HTTP/1.1 timeout, curl exit 28, status 000) - the
  same behaviour recorded in review.yml on the same day. services.casa.gov.au and
  my.casa.gov.au answer normally with a browser user-agent and return clean 404s.
  data.casa.rpasplatform.net answers 403 to every path, including paths that do not
  exist, because it is a Google Cloud Storage bucket with a deny-by-default ACL.
