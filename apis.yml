  - aid: casa-aviation:casa-rpas-digital-platform
    name: CASA RPAS Digital Platform API
    description: >-
      A partner-only API that supplies CASA advisories, notifications and
      geospatial map data to drone safety applications, and processes Automated
      Airspace Authorisations for Sydney Harbour (R405A/B) and ten trial
      controlled aerodromes. Endpoints are named in the public RPAS Platform
      Operating Rules — advisories.geojson and notifications.json under
      /casa/data/, plus /casa/gcd and /asa/gcd for geospatial content — and the
      Operating Rules state the URLs need authentication with a service account.
      Access requires a written application, acceptance of the RPAS Platform
      Terms and Conditions, a formal onboarding check-out against the RPAS
      Platform Test Procedure (two attempts allowed), staging then production
      credentials issued by CASA, and a paid Airservices Australia airspace data
      licence sourced independently. CASA has paused onboarding of new providers
      for the ten trial aerodromes pending Airservices' Flight Information
      Management System. Not a self-serve API.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
