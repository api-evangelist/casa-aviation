url: https://raw.githubusercontent.com/api-evangelist/casa-aviation/refs/heads/main/apis.yml
name: Civil Aviation Safety Authority (CASA)
kind: company
description: >-
  The Civil Aviation Safety Authority (CASA) is Australia's independent statutory
  aviation safety regulator, established under the Civil Aviation Act 1988. It
  maintains the Australian Civil Aircraft Register (VH- marks), issues
  Airworthiness Directives, licenses flight crew and maintenance organisations,
  certifies air operators, and regulates drone and RPAS operations. CASA sits
  entirely OUTSIDE the travel distribution chain — it is a safety regulator, not
  a distributor, so it has no GDS, NDC, channel-manager or OTA position, and
  airline fare distribution, full-content agreements and consumer disclosure are
  not CASA functions. Its API posture is split and honest: two genuinely open,
  no-key, documented bulk data products (the full Airworthiness Directives
  listing as JSON/CSV and the complete civil aircraft register as a daily CSV,
  both served from services.casa.gov.au), and one approval-gated partner API —
  the CASA RPAS Digital Platform at data.casa.rpasplatform.net — whose endpoints
  are named in public PDFs but require a service account, a signed four-year
  agreement, a CASA onboarding check-out and a paid Airservices Australia
  airspace data licence. There is no self-serve developer portal, no OpenAPI, and
  new RPAS Platform onboarding is currently paused pending Airservices' Flight
  Information Management System.
