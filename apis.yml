apis:
  - aid: casa-aviation:casa-airworthiness-directives-data
    name: CASA Airworthiness Directives Data Files
    description: >-
      Open, unauthenticated bulk data files covering every current Australian
      Airworthiness Directive (AD). combinedadweb.json lists all current ADs with
      aircraft and equipment references; adweb.csv lists all current ADs and
      folder.csv lists the aircraft and equipment types. Individual AD documents
      are addressable as PDFs under /airworth/airwd/ADfiles/ by folder and file
      number. CASA states the JSON file format is subject to change. No API key,
      no registration and no terms acceptance are required to download.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
