  - aid: casa-aviation:casa-aircraft-register-data
    name: Australian Civil Aircraft Register Data Files
    description: >-
      The complete Australian Civil Aircraft Register published as a daily
      comma-delimited data file (acrftreg.csv, approximately 7.6MB) and a zip
      compressed equivalent (acrftreg.zip, approximately 1MB). CASR 47.030
      requires CASA to publish or make available data relating to the civil
      register; only aircraft currently registered in Australia are included.
      Records carry VH- registration marks, manufacturer, model, serial number,
      MTOW, year and country of manufacture, engine and propeller details, ICAO
      Doc 8643 type designator, type certificate, registration holder and
      registered operator with address and commencement dates. Coded fields are
      documented on separate CASA pages. No API key or registration required.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
