dead_columns:
  note: >-
    Two of the 44 register columns are empty in EVERY one of the 16,660 rows.
    They are published, documented as coded fields, and carry no data at all.
  columns:
    - {field: gear, distinct_values: 1, only_value: '', rows: 16660, meaning_documented_as: landing gear code}
    - {field: CoAcatc, distinct_values: 1, only_value: '', rows: 16660, meaning_documented_as: Certificate of Airworthiness category C}

non_enumerable_fields:
  note: >-
    These look like coded fields and are not. Recorded so nobody tries to build a
    code list from them.
  fields:
    - {field: regholdState, distinct: 94, finding: 'Free text. NSW/QLD/VIC/WA/SA/NT/ACT/TAS abbreviations coexist with the full state names ("Queensland", 254 rows), with overseas states and cities (DELAWARE, Tokyo, Dublin 4, PARIS), and with junk ("."). Normalise before any geographic analysis.'}
    - {field: regopState, distinct: 33, finding: 'Same problem, smaller tail: "W.A", "N.T", "Q", "western  Australia" (double space), a bare postcode "3028" and suburb names in the state column.'}
    - {field: Manu, finding: 'Manufacturer names are free text with no identifier. The same manufacturer appears under legacy and current corporate names.'}
    - {field: Engmanu / Propmanu, finding: 'Free text plus the sentinel strings AIRCRAFT NOT FITTED WITH ENGINE and AIRCRAFT NOT FITTED WITH PROPELLER, with Engmodel / Propmodel set to NOT APPLICABLE.'}
    - {field: SeriesName, distinct: 425, finding: 'The AD type-series names. Enumerable but large; consume folder.csv directly rather than copying it here. folder.csv publishes 426 series and 425 of them have at least one directive - FOLDERNAME "CT58" is published with zero directives against it (verified 2026-07-28 by set-differencing all 426 folder.csv FOLDERNAMEs against the 425 distinct FOLDERNAMEs in the 17,738 AD records). No AD references a FOLDERNAME missing from folder.csv, so the join is total in that direction.'}

data_quality_findings:
  - 'Authority carries a spelling error ("Candada") and a case error ("EASa") in the live file.'
  - 'CoAcatb contains a value with duplicated categories: "Active (Amateur-Built; Amateur-Built; Experimental; Experimental)".'
  - 'regType uses upper-case SUSPENDED where every other value is title case.'
  - 'Cancelled directives are 24.4% of the AD file and are not separated out; Urgent is a status, not a flag.'
  - 'Two of 44 register columns are entirely empty.'
  - 'State fields are free text with 94 distinct values across 8 real Australian states.'

