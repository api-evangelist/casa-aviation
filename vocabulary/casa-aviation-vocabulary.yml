generated: '2026-07-28'
method: derived
source: >-
  Complete value-set extraction over the full live CASA data files retrieved
  2026-07-28: https://services.casa.gov.au/CSV/acrftreg.csv (16,660 rows, 44
  columns, Last-Modified Mon 27 Jul 2026 22:16:25 GMT) and
  https://services.casa.gov.au/JSON/combinedadweb.json (17,738 records,
  Last-Modified Mon 27 Jul 2026 00:45:18 GMT), plus
  https://services.casa.gov.au/airworth/airwd/data/folder.csv (426 series rows).
summary: >-
  CASA documents the MEANING of its coded fields in prose on casa.gov.au but
  publishes no machine-readable code list anywhere. This vocabulary is the
  complete distinct value set for every enumerable field, computed by reading
  every record in every published file - not sampled, not inferred and not copied
  from a CASA page. Counts are the observed frequency on 2026-07-28. Where a
  field turned out NOT to be enumerable (free-text party addresses, manufacturer
  names) that is recorded as a finding rather than forced into a code list.
completeness: >-
  Every enumeration below is EXHAUSTIVE for the 2026-07-28 snapshot - the count
  of distinct values equals the number of entries listed. CASA gives no notice
  of value-set changes, so treat these as observed-and-dated, not contractual.
  Validate on ingest.
caveat: >-
  These are CASA's operational values, not a governed code list. Several fields
  carry the same real-world concept under multiple spellings (see
  data_quality_findings). Normalise before you group or join.

